[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papersizes-guide"
version = "1.0.0"
description = "Every standard paper size offline: ISO A/B/C, US and ANSI, ARCH, envelopes, photo, card, book and regional formats, with dimensions in mm, cm, inches, points and pixels."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
authors = [{ name = "papersizes.guide" }]
keywords = ["paper", "paper-size", "a4", "letter", "iso-216", "ansi", "print", "dimensions", "dpi", "envelope"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Printing",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://papersizes.guide/data/"
Documentation = "https://papersizes.guide/data/"
Source = "https://github.com/nanosani/papersizes-guide"
Issues = "https://github.com/nanosani/papersizes-guide/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/papersizes_guide"]

[tool.hatch.build.targets.sdist]
include = ["src/papersizes_guide", "README.md", "LICENSE"]
