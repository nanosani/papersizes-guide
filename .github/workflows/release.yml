name: Release

# Publishes both packages when a version tag is pushed:
#
#   git tag v1.0.1 && git push --tags
#
# Neither registry needs a stored secret. Both use OIDC trusted publishing, so
# GitHub proves the release came from this workflow in this repository and the
# registry issues a short-lived credential itself.
#
# One-time setup, done on each registry's website:
#   npm   https://www.npmjs.com/package/papersizes-guide/access
#         Add a trusted publisher: repository nanosani/papersizes-guide,
#         workflow release.yml
#   PyPI  https://pypi.org/manage/project/papersizes-guide/settings/publishing/
#         Add a GitHub publisher: owner nanosani, repository papersizes-guide,
#         workflow release.yml

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Use a recent npm
        run: npm install -g npm@latest

      - name: Check the tag matches package.json
        working-directory: npm/papersizes-guide
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Smoke test before publishing
        working-directory: npm/papersizes-guide
        run: |
          node -e "
            const p = require('./index.js');
            const a4 = p.get('A4');
            if (a4.widthMm !== 210 || a4.heightMm !== 297) throw new Error('A4 wrong');
            if (p.find(8.5, 11, { unit: 'in' })[0].size.name !== 'Letter') throw new Error('Letter lookup wrong');
            if (p.all().length < 300) throw new Error('dataset looks truncated');
            console.log('ok:', p.all().length, 'sizes, dataset', p.version);
          "

      - name: Publish
        working-directory: npm/papersizes-guide
        run: npm publish --access public

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches pyproject.toml
        working-directory: pypi
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$tag pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $tag does not match pyproject.toml version $pkg"
            exit 1
          fi

      - name: Smoke test before publishing
        working-directory: pypi
        run: |
          PYTHONPATH=src python -c "
          import papersizes_guide as paper
          a4 = paper.get('A4')
          assert (a4.width_mm, a4.height_mm) == (210, 297), 'A4 wrong'
          assert paper.find(8.5, 11, unit='in')[0].size.name == 'Letter', 'Letter lookup wrong'
          assert len(paper.all_sizes()) >= 300, 'dataset looks truncated'
          print('ok:', len(paper.all_sizes()), 'sizes, dataset', paper.VERSION)
          "

      - name: Build
        working-directory: pypi
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/dist
